<svg xmlns="http://www.w3.org/2000/svg" width="658" height="132" viewBox="0 0 658 132">
  <title>作りたいものを、気の向くままに作っています。</title>
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="329" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','YuGothic','Noto Sans JP','Noto Sans CJK JP',Meiryo,sans-serif" font-size="46" letter-spacing="1">
    <text x="0" y="50" font-weight="300" fill="#9198a1">作りたいものを、</text>
    <text x="0" y="114" font-weight="800" fill="#f0f6fc"><tspan fill="url(#accent)">気の向くままに</tspan>作っています。</text>
  </g>
</svg>
